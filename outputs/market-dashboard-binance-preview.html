<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>시황 한 장 - Binance Style Preview</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="page-shell" aria-labelledby="page-title">
      <nav class="market-nav" aria-label="시장 대시보드">
        <a class="brand-mark" href="../index.html" aria-label="시황 한 장 홈">
          <span class="brand-symbol" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </span>
          <span>MARKET ONE</span>
        </a>
        <div class="nav-links" aria-label="시장 분류">
          <span>Rates</span>
          <span>FX</span>
          <span>Equity</span>
          <span>Bonds</span>
        </div>
      </nav>

      <header class="dashboard-header">
        <div>
          <p class="eyebrow" id="today-label">오늘</p>
          <h1 id="page-title">시황 한 장</h1>
        </div>
        <div class="data-badge" aria-label="데이터 상태">더미 데이터</div>
      </header>

      <section class="summary-strip" aria-label="시장 요약">
        <div>
          <span class="summary-label">요약</span>
          <strong>금리와 환율, 주식, 채권을 한 화면에서 확인합니다.</strong>
        </div>
        <span class="summary-time" id="updated-label">업데이트 준비 중</span>
      </section>

      <section class="metric-grid" id="metric-grid" aria-label="주요 시황 지표"></section>
    </main>

    <script src="../script.js"></script>
  </body>
</html>
