<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>보험금 청구 절차 인포그래픽</title>
    <style>
      :root {
        --blue: #0068ff;
        --pale-blue: #e7f2ff;
        --ink: #0b1f40;
        --muted: #526477;
        --page: #f6f9fd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        font-family:
          Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Segoe UI",
          sans-serif;
        background: var(--page);
        color: var(--ink);
      }

      main {
        width: min(100%, 1200px);
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 24px;
        box-shadow: 0 24px 60px rgba(0, 64, 160, 0.13);
      }

      .text-check {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
    </style>
  </head>
  <body>
    <main aria-label="보험금 청구 절차 인포그래픽 미리보기">
      <img src="./insurance-claim-procedure-infographic.svg" alt="보험금 청구 절차: 접수에서 서류심사를 거쳐 지급으로 이어지는 파란색 계열 인포그래픽" />
      <p class="text-check">접수 → 서류심사 → 지급</p>
    </main>
  </body>
</html>
