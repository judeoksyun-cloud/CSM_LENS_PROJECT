<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">보험금 청구 절차 인포그래픽</title>
  <desc id="desc">접수, 서류심사, 지급 단계가 파란색 계열의 플랫 스타일 카드와 화살표로 연결된 공개용 더미 안내 이미지</desc>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0b3a78" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="heroBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f2ff"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <marker id="arrowHead" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 7 L2 12" fill="none" stroke="#0068ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>

  <rect x="54" y="42" width="1092" height="588" rx="32" fill="url(#heroBlue)"/>
  <circle cx="1010" cy="116" r="68" fill="#cfe6ff" opacity="0.65"/>
  <circle cx="1092" cy="184" r="28" fill="#dcecff" opacity="0.95"/>
  <circle cx="150" cy="548" r="54" fill="#dbefff" opacity="0.75"/>

  <g transform="translate(92 82)">
    <rect x="0" y="0" width="146" height="38" rx="19" fill="#0068ff"/>
    <text x="73" y="25" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">공개용 더미</text>
    <text x="0" y="94" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-1" fill="#0b1f40">보험금 청구 절차</text>
    <text x="0" y="132" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="21" font-weight="500" fill="#526477">접수부터 지급까지 핵심 흐름만 간단히 확인하세요.</text>
  </g>

  <g class="steps" transform="translate(80 265)">
    <g class="step-card" filter="url(#cardShadow)">
      <rect x="0" y="0" width="280" height="230" rx="22" fill="#ffffff"/>
      <rect x="24" y="24" width="72" height="72" rx="24" fill="#e7f2ff"/>
      <path d="M51 42 H75 M51 57 H78 M51 72 H70" stroke="#0068ff" stroke-width="5" stroke-linecap="round"/>
      <path d="M41 38 H82 V82 H41 Z" fill="none" stroke="#0068ff" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="210" cy="52" r="22" fill="#0068ff"/>
      <text x="210" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">1</text>
      <text x="28" y="134" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="34" font-weight="800" fill="#0b1f40">접수</text>
      <text x="28" y="171" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="18" font-weight="500" fill="#526477">청구 내용을 등록하고</text>
      <text x="28" y="199" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="18" font-weight="500" fill="#526477">기본 정보를 확인합니다.</text>
    </g>

    <path class="arrow arrow-1" d="M300 115 H350" fill="none" stroke="#0068ff" stroke-width="8" stroke-linecap="round" marker-end="url(#arrowHead)"/>

    <g class="step-card" transform="translate(370 0)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="280" height="230" rx="22" fill="#ffffff"/>
      <rect x="24" y="24" width="72" height="72" rx="24" fill="#e7f2ff"/>
      <path d="M45 38 H74 L83 47 V84 H45 Z" fill="none" stroke="#0068ff" stroke-width="5" stroke-linejoin="round"/>
      <path d="M74 38 V48 H83" fill="none" stroke="#0068ff" stroke-width="5" stroke-linejoin="round"/>
      <path d="M54 59 H73 M54 73 H78" stroke="#0068ff" stroke-width="5" stroke-linecap="round"/>
      <circle cx="210" cy="52" r="22" fill="#0068ff"/>
      <text x="210" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">2</text>
      <text x="28" y="134" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="34" font-weight="800" fill="#0b1f40">서류심사</text>
      <text x="28" y="171" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="18" font-weight="500" fill="#526477">제출 서류와 조건을</text>
      <text x="28" y="199" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="18" font-weight="500" fill="#526477">차례대로 검토합니다.</text>
    </g>

    <path class="arrow arrow-2" d="M670 115 H720" fill="none" stroke="#0068ff" stroke-width="8" stroke-linecap="round" marker-end="url(#arrowHead)"/>

    <g class="step-card" transform="translate(740 0)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="280" height="230" rx="22" fill="#ffffff"/>
      <rect x="24" y="24" width="72" height="72" rx="24" fill="#e7f2ff"/>
      <rect x="42" y="52" width="46" height="30" rx="8" fill="none" stroke="#0068ff" stroke-width="5"/>
      <path d="M48 51 V45 C48 38 54 33 65 33 C76 33 82 38 82 45 V51" fill="none" stroke="#0068ff" stroke-width="5" stroke-linecap="round"/>
      <path d="M58 68 H72" stroke="#0068ff" stroke-width="5" stroke-linecap="round"/>
      <circle cx="210" cy="52" r="22" fill="#0068ff"/>
      <text x="210" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">3</text>
      <text x="28" y="134" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="34" font-weight="800" fill="#0b1f40">지급</text>
      <text x="28" y="171" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="18" font-weight="500" fill="#526477">심사 완료 후 안내된</text>
      <text x="28" y="199" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="18" font-weight="500" fill="#526477">계좌로 지급됩니다.</text>
    </g>
  </g>

  <g transform="translate(92 552)">
    <rect x="0" y="0" width="1016" height="40" rx="20" fill="#ffffff" opacity="0.86"/>
    <circle cx="24" cy="20" r="7" fill="#0068ff"/>
    <text x="44" y="26" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="16" font-weight="600" fill="#526477">회사명 없이 제작된 공개용 안내 예시입니다. 실제 제출 서류와 지급 기준은 상품 및 약관에 따라 달라질 수 있습니다.</text>
  </g>
</svg>
